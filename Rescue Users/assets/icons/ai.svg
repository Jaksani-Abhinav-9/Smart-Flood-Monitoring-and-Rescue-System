<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none">
  <defs>
    <linearGradient id="aiGrad" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="12" y1="2" x2="12" y2="5" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12" cy="2" r="1.5" fill="#fde047"/>
  <!-- Bot Head -->
  <rect x="4" y="5" width="16" height="14" rx="4.5" fill="rgba(245, 158, 11, 0.22)" stroke="url(#aiGrad)" stroke-width="1.8"/>
  <!-- Visor / Eyes -->
  <rect x="7" y="9.5" width="10" height="4" rx="2" fill="#fde047"/>
  <circle cx="9.5" cy="11.5" r="1" fill="#0f172a"/>
  <circle cx="14.5" cy="11.5" r="1" fill="#0f172a"/>
  <!-- Ears / Sensors -->
  <line x1="2" y1="11" x2="4" y2="11" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="11" x2="22" y2="11" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth grid -->
  <line x1="9" y1="16" x2="15" y2="16" stroke="#fde047" stroke-width="1.4" stroke-linecap="round"/>
</svg>
