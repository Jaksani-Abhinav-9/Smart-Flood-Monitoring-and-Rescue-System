<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Citizen Profile | Smart Flood Monitoring and Rescue System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/home.css" />
  <style>
    body {
      overflow: auto;
      background: radial-gradient(60% 50% at 15% 8%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
                  radial-gradient(50% 45% at 90% 12%, rgba(37, 99, 235, 0.08) 0%, transparent 65%),
                  var(--bg);
    }

    .app-shell {
      min-height: 100vh;
      position: relative;
    }

    .map-shell {
      position: relative;
      min-height: 100vh;
      width: 100%;
    }

    .left-sidebar-dock {
      position: absolute;
      top: 92px;
      left: 16px;
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1002;
      pointer-events: none;
    }

    .left-sidebar-dock > * {
      pointer-events: auto;
    }

    .sidebar-panel {
      position: relative;
      top: auto;
      left: auto;
      width: 100%;
      overflow: hidden;
      padding: 18px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(8, 14, 25, 0.96), rgba(4, 7, 14, 0.94));
      border: 1px solid var(--border);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65), 0 0 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(24px) saturate(150%);
      display: grid;
      gap: 12px;
    }

    .profile-content {
      padding: 92px 24px 24px 280px;
      display: flex;
      justify-content: center;
    }

    .profile-card {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      padding: 24px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(17, 28, 48, 0.92), rgba(11, 18, 33, 0.86));
      border: 1px solid rgba(94, 234, 212, 0.16);
      box-shadow: 0 24px 60px rgba(2, 6, 16, 0.38);
      color: var(--text);
    }

    .profile-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .profile-avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      cursor: pointer;
      box-shadow: 0 16px 40px rgba(59, 130, 246, 0.25);
      position: relative;
      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .profile-avatar::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(94, 234, 212, 0.6);
      animation: pulse 2s infinite;
    }

    .profile-actions {
      display: flex;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    .profile-actions button {
      flex: 1 1 120px;
      min-height: 42px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .profile-actions button.primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border-color: transparent;
    }

    .profile-info {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: 100%;
    }

    .profile-info div {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .profile-info span {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .profile-info strong {
      font-size: 0.98rem;
      color: var(--text);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .stat-box {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .stat-box .label {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-box strong {
      font-size: 1.1rem;
      color: var(--text);
    }

    @keyframes pulse {
      from { opacity: 0.6; transform: scale(1); }
      to { opacity: 0; transform: scale(1.35); }
    }

    @media (max-width: 900px) {
      .profile-card {
        grid-template-columns: 1fr;
      }

      .left-sidebar-dock {
        position: relative;
        top: auto;
        left: auto;
        width: 100%;
        padding: 90px 16px 0;
      }

      .profile-content {
        padding: 20px 16px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <section class="top-bar" aria-label="App status bar">
      <div class="brand">Smart Flood Monitoring and Rescue System</div>
      <div id="connectivityStatus" class="connectivity" aria-live="polite">
        <span></span>
        Online
      </div>
    </section>

    <main class="map-shell">
      <div class="left-sidebar-dock">
        <aside class="sidebar-panel" aria-label="Main navigation">
          <div class="sidebar-header">
            <h2>Quick Actions</h2>
          </div>
          <nav class="sidebar-list" aria-label="Primary navigation">
            <button class="sidebar-btn active" type="button" onclick="window.location.href='profile.html'">
              <span class="icon">👤</span>
              <span>Profile</span>
            </button>
            <button class="sidebar-btn" type="button" onclick="window.location.href='home.html'">
              <span class="icon">🤖</span>
              <span>AI Assistant</span>
            </button>
            <button class="sidebar-btn" type="button" onclick="window.location.href='home.html'">
              <span class="icon">🏠</span>
              <span>Home</span>
            </button>
            <button class="sidebar-btn sos-action" id="sosActionBtn" type="button" aria-label="Hold to confirm SOS" onclick="openSosOverlay()">
              <span class="icon">🚨</span>
              <span>SOS</span>
            </button>
            <button class="sidebar-btn alerts" id="alertsOpenBtn" type="button" onclick="openAlertsOverlay()">
              <span class="icon">🔔</span>
              <span>Alerts</span>
            </button>
          </nav>
        </aside>
      </div>

      <section class="profile-content" aria-label="User profile">
        <div class="profile-card">
          <div style="grid-column: 1 / -1; display: flex; justify-content: flex-start; margin-bottom: -10px;">
            <button onclick="location.href='home.html'" style="padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: var(--text); font-weight: 500; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s ease;">
              ← Back to Home
            </button>
          </div>
          
          <div class="profile-side">
            <div class="profile-avatar" id="profileAvatar">👤</div>
            <h3 id="userName">Citizen User</h3>
            <p id="userEmail">Loading profile…</p>
            <div class="profile-actions">
              <button type="button" onclick="window.logout()">Logout</button>
            </div>
          </div>

          <div>
            <div class="profile-info">
              <div>
                <span>Phone</span>
                <strong id="userPhone">-</strong>
              </div>
              <div>
                <span>Role</span>
                <strong id="userRole">Citizen</strong>
              </div>
              <div>
                <span>Location</span>
                <strong id="userLocation">-</strong>
              </div>
              <div>
                <span>Account</span>
                <strong>Verified</strong>
              </div>
            </div>

            <div class="stat-grid">
              <div class="stat-box">
                <span class="label">Active SOS</span>
                <strong id="activeSOSCount">0</strong>
              </div>
              <div class="stat-box">
                <span class="label">Alerts</span>
                <strong id="alertCount">0</strong>
              </div>
              <div class="stat-box">
                <span class="label">Status</span>
                <strong>Safe</strong>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="confirmSOSOverlay" class="overlay" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-sos-title">
      <h3 id="confirm-sos-title">Confirm SOS</h3>
      <p>Hold for <strong id="sosCountdown">3</strong> seconds to trigger an emergency alert.</p>
      <div class="dialog-actions">
        <button class="secondary" id="confirmCancelBtn" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <div id="alertsOverlay" class="alerts-overlay" aria-hidden="true">
    <div class="alerts-panel" role="dialog" aria-modal="true" aria-labelledby="alerts-title">
      <h3 id="alerts-title">Alerts</h3>
      <div id="alertsList"></div>
      <button class="close-btn" id="alertsCloseBtn" type="button">Close</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/profile.js"></script>
  <script>
    const avatar = document.getElementById('profileAvatar');
    const avatarInput = document.createElement('input');
    avatarInput.type = 'file';
    avatarInput.accept = 'image/*';
    avatarInput.style.display = 'none';
    document.body.appendChild(avatarInput);

    const savedAvatar = localStorage.getItem('profileAvatar');
    if (savedAvatar) {
      avatar.innerHTML = `<img src="${savedAvatar}" alt="Profile avatar">`;
    }

    avatar.addEventListener('click', () => avatarInput.click());
    avatarInput.addEventListener('change', () => {
      const file = avatarInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        localStorage.setItem('profileAvatar', reader.result);
        avatar.innerHTML = `<img src="${reader.result}" alt="Profile avatar">`;
      };
      reader.readAsDataURL(file);
    });

    const confirmOverlay = document.getElementById('confirmSOSOverlay');
    const alertsOverlay = document.getElementById('alertsOverlay');
    const toastEl = document.getElementById('toast');
    let sosHoldTimer = null;
    let holdSeconds = 3;

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2700);
    }

    function openSosOverlay() {
      confirmOverlay.classList.add('show');
      let seconds = holdSeconds;
      const countdownEl = document.getElementById('sosCountdown');
      countdownEl.innerText = seconds;
      if (sosHoldTimer) clearInterval(sosHoldTimer);
      sosHoldTimer = setInterval(() => {
        seconds -= 1;
        countdownEl.innerText = seconds;
        if (seconds <= 0) {
          clearInterval(sosHoldTimer);
          confirmOverlay.classList.remove('show');
          showToast('SOS sent. Help is on the way.');
        }
      }, 1000);
    }

    function closeSosOverlay() {
      if (sosHoldTimer) clearInterval(sosHoldTimer);
      confirmOverlay.classList.remove('show');
    }

    function openAlertsOverlay() {
      alertsOverlay.classList.add('show');
      const container = document.getElementById('alertsList');
      container.innerHTML = `
        <div class="alert-card">
          <header><h4>Road closure near NH44</h4><span class="alert-badge warning">WARNING</span></header>
          <p>Flooding reported on the east side of Kamareddy. Avoid the highway.</p>
          <small>2m ago</small>
        </div>
        <div class="alert-card">
          <header><h4>Shelter open at Govt. School</h4><span class="alert-badge info">INFO</span></header>
          <p>Temporary relief camp available 1.4 km away.</p>
          <small>7m ago</small>
        </div>
      `;
    }

    document.getElementById('confirmCancelBtn').addEventListener('click', closeSosOverlay);
    document.getElementById('alertsCloseBtn').addEventListener('click', () => alertsOverlay.classList.remove('show'));
    confirmOverlay.addEventListener('click', (event) => {
      if (event.target === confirmOverlay) closeSosOverlay();
    });
    alertsOverlay.addEventListener('click', (event) => {
      if (event.target === alertsOverlay) alertsOverlay.classList.remove('show');
    });
  </script>
</body>
</html>
